<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Eko Streets</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
      #canvas-container { position: absolute; inset: 0; }
      #fps-counter {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(20, 20, 20, 0.85);
        color: #2ed573;
        font-family: monospace;
        font-size: 14px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10;
      }
      #instructions {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(20, 20, 20, 0.85);
        color: #fff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #wasted-screen {
        position: fixed;
        inset: 0;
        background: rgba(180, 20, 20, 0.35);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        backdrop-filter: blur(4px);
        transition: opacity 0.5s ease;
      }
      #wasted-title {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 8px;
        color: #e74c3c;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(231, 76, 60, 0.8);
        font-family: Impact, 'Arial Black', sans-serif;
        text-transform: uppercase;
        animation: pulseWasted 1.5s infinite;
      }
      #wasted-sub {
        font-size: 18px;
        color: #fff;
        margin-top: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      }
      @keyframes pulseWasted {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BmhH31hU.js"></script>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="fps-counter">FPS: 60</div>
    <div id="instructions">Eko Streets — Move: W A S D / Arrow Keys | Beware of oncoming traffic!</div>
    <div id="wasted-screen">
      <div id="wasted-title">WASTED</div>
      <div id="wasted-sub">Hit by oncoming vehicle! Respawning...</div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pitakwa Streets — Open World Port Harcourt</title>
    <link rel="icon" type="image/png" href="./cover.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0c10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f5f6fa;
      }
      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* start.ng Profile Card */
      .startng-card {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 8px 18px 8px 10px;
        border-radius: 999px;
        background: rgba(22, 24, 30, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .startng-card img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #fbc531;
        object-fit: cover;
        border: 2px solid #fbc531;
      }
      .startng-card .info {
        display: flex;
        flex-direction: column;
      }
      .startng-card b {
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
      }
      .startng-card span {
        font-size: 11px;
        color: #a4b0be;
      }
      .startng-card button {
        margin-left: 6px;
        border: none;
        border-radius: 999px;
        padding: 6px 14px;
        background: #fbc531;
        color: #1e272e;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s, background 0.15s;
      }
      .startng-card button:hover {
        background: #e1b12c;
        transform: scale(1.04);
      }
      .mock-badge {
        display: none;
        font-size: 10px;
        background: #4834d4;
        color: #ffffff;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 4px;
        font-weight: 600;
      }
      /* Spike Stats Overlay */
      #spike-stats {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(15, 17, 23, 0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 12px;
        line-height: 1.6;
        color: #ced6e0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        max-width: 480px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #title-tag {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        text-align: right;
      }
      #title-tag h1 {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #fbc531;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #title-tag p {
        font-size: 11px;
        color: #a4b0be;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div class="startng-card" id="player-card">
      <img id="player-face" alt="Character" src="" />
      <div class="info">
        <b id="player-name">Loading...</b>
        <span><span id="player-account">@startng</span><span id="mock-badge" class="mock-badge">MOCK</span></span>
      </div>
      <button id="player-sign-in">Sign in</button>
    </div>

    <div id="title-tag">
      <h1 style="color:#0984e3">Pitakwa Streets</h1>
      <p>PORT HARCOURT & NIGER DELTA DRIVE</p>
    </div>

    <div id="spike-stats">Initializing Phase 0 Spikes...</div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
